version: "3.8"

# 一键起真实向量库后端（v0.2.0 深度整合）：
#   docker compose up -d pgvector                  # 只起 pgvector
#   docker compose up -d etcd minio milvus         # 只起 Milvus standalone
# 本地调试若不使用 Docker：
#   - Milvus 可直接用 milvus-lite（.env 设 MILVUS_MODE=local）
#   - pgvector 需要一个可连接的 PostgreSQL + vector 扩展

services:
  # ===================== pgvector =====================
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: resume_agent_pgvector
    environment:
      POSTGRES_DB: resume_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== Milvus standalone =====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: resume_agent_milvus_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: resume_agent_milvus_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: resume_agent_milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

volumes:
  pgvector_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
